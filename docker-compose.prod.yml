# PRODUCTION run — pull image จาก "local registry ในออฟฟิศ" (ไม่ build บนเครื่อง)
# (กระบวนการเดียวกับ wms-frontend)
#
# image ถูก build บนเครื่องในออฟฟิศด้วย deploy/build-push-local.sh → server ดึงผ่าน LAN
#
# setup ครั้งเดียวบน server: /etc/docker/daemon.json
#   { "insecure-registries": ["192.168.20.52:5000"] }   แล้ว sudo systemctl restart docker
#
#   bash deploy/deploy.sh          ← แนะนำ (pull + up + health check)
#   docker compose -f docker-compose.prod.yml logs -f
#
# ⭐ ค่า DB / QR_SECRET อ่านจาก ".env ของเครื่องนี้" ตอนรัน (ไม่ bake เข้า image)
#    เปลี่ยน DB/secret = แก้ .env แล้ว bash deploy/deploy.sh ใหม่ (ไม่ต้อง rebuild)
#
# client เปิด http://<host>:4101
name: newyear-checkin

services:
  app:
    image: ${NEWYEAR_CHECKIN_IMAGE:-192.168.20.52:5000/newyear-checkin:main}
    container_name: newyear2026-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Asia/Bangkok
      # :? = บังคับต้องมีใน .env ไม่งั้น compose ฟ้องทันที (ไม่ใส่ default รหัสผ่านไว้ในไฟล์)
      DB_HOST: ${DB_HOST:?ต้องตั้ง DB_HOST ใน .env ข้าง docker-compose.prod.yml}
      DB_USER: ${DB_USER:?ต้องตั้ง DB_USER ใน .env}
      DB_PASSWORD: ${DB_PASSWORD:?ต้องตั้ง DB_PASSWORD ใน .env}
      DB_NAME: ${DB_NAME:?ต้องตั้ง DB_NAME ใน .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-150}
      DB_QUEUE_LIMIT: ${DB_QUEUE_LIMIT:-200}
      QR_SECRET: ${QR_SECRET:?ต้องตั้ง QR_SECRET ใน .env}
      PORT: "4101"
    ports:
      - "${APP_PORT:-4101}:4101"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4101/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - newyear2026-network

networks:
  newyear2026-network:
    driver: bridge
